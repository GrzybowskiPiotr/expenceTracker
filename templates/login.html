{% extends "layout.html" %} {% block title %} Log In {% endblock %} {% block
main %}
<div class="card p-4" style="width: fit-content">
  <div class="card-body">
    <h1 class="mb-4 fs-6 fw-bolder text-uppercase">Login to app</h1>
    <form action="/login" method="post">
      <div class="mb-3">
        <input
          autocomplete="off"
          autofocus
          class="form-control mx-auto w-auto"
          name="username"
          placeholder="Username"
          type="text"
        />
      </div>
      <div class="mb-3">
        <input
          class="form-control mx-auto w-auto"
          name="password"
          placeholder="Password"
          type="password"
        />
      </div>
      <div
        class="d-flex gap-3 container-fluid justify-content-center align-items-center"
      >
        <button class="btn btn-primary" id="login" type="submit">Log In</button>
        <a class="btn btn-secondary" href="/">Cancle</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
