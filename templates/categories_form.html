{% extends "layout.html" %} {% block title %} {{ "Add new category" if mode ==
"add" else "Edit category"}} {% endblock %} {% block main %}
<div class="container mt-4" style="max-width: 500px">
  <h2 class="mb-3">
    {{ "Add new category" if mode == "add" else "Edit category" }}
  </h2>

  <form method="post" action="{{ action_url }}">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input
        type="text"
        name="name"
        class="form-control"
        required
        value="{{ category.name if category else '' }}"
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="3">
{{ category.description if category else '' }}</textarea
      >
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        {{ "Add" if mode == "add" else "Save changes" }}
      </button>

      <a href="/categories" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock%}
