{% extends "layout.html" %} {% block title %} Account Settings {% endblock %} {%
block main %}
<div class="card p-4" style="width: fit-content">
  <div class="card-body">
    <h1 class="mb-4 fs-6 fw-bolder text-uppercase">Account Settings</h1>
  </div>
  <div class="container w-auto">
    <form action="/account_settings" method="post">
      <div class="mb-3">
        <input
          autocomplete="off"
          autofocus
          class="form-control mx-auto w-auto"
          name="username"
          placeholder="Username"
          type="text"
          value="{{ user.username }}"
        />
      </div>
      <div class="mb-3">
        <input
          class="form-control mx-auto w-auto"
          name="password"
          placeholder="New password"
          type="password"
        />
      </div>
      <div class="mb-3">
        <input
          class="form-control mx-auto w-auto"
          name="confirmation"
          placeholder="Confirm new password"
          type="password"
        />
      </div>
      <div class="mt-4 d-flex gap-3">
        <button class="btn btn-primary" id="register" type="submit">
          Save changes
        </button>
        <a class="btn btn-secondary" href="/dashboard">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
