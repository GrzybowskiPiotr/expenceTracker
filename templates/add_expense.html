{% extends "layout.html" %} {% block title %} Add Expense {% endblock %} {%
block main %}
<div class="card p-4" style="width: fit-content">
  <div class="card-body">
    <h1 class="mb-4 fs-6 fw-bolder text-uppercase">Add new expence</h1>

    <form action="/add_expense" method="post" id="add_expense">
      <div class="mb-3">
        <input
          autocomplete="off"
          autofocus
          class="form-control mx-auto w-auto"
          name="amount"
          placeholder="Amount of expense"
          type="number"
          step="0.01"
          min="0"
          required
        />
      </div>
      <div class="mb-3">
        <select
          class="form-select form-select-md mb-3"
          name="category"
          required
        >
          <option selected value="0" disabled>Select Category</option>
          {% for cat in categories %}
          <option value="{{cat.id}}">{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-floating">
        <textarea
          name="description"
          id="description"
          class="form-control"
          name="description"
          placeholder="Expense description (optional)"
          type="text"
          style="resize: none; min-height: 100px"
        ></textarea>
        <label for="description">Description (optional)</label>
      </div>
      <button class="btn btn-primary mt-5" id="add_expense" type="submit">
        Add Expense
      </button>
    </form>
  </div>

  {% endblock %}
</div>
